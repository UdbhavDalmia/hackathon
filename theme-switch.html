<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Hackathon Starter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    :root {
      --text: #1e1e24;
      --background: #f7ebe8;
      --primary: #e54b4b;
      --secondary: #444140;
      --accent: #ffa987;
    }

    .dark {
      --text: #dbdbe1;
      --background: #170b08;
      --primary: #b31919;
      --secondary: #bfbcbb;
      --accent: #7a2300;
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class', 
      theme: {
        extend: {
          colors: {
            'text': 'var(--text)',
            'background': 'var(--background)',
            'primary': 'var(--primary)',
            'secondary': 'var(--secondary)',
            'accent': 'var(--accent)',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-text font-sans selection:bg-accent/30 min-h-screen p-8">
    <button onclick="toggleTheme()" class="p-3 bg-primary text-background rounded-full shadow-lg hover:scale-110 transition-transform">
        <span class="dark:hidden">🌙</span>
        <span class="hidden dark:inline">☀️</span>
    </button>
    <script>
        const toggleTheme = () => {
          document.documentElement.classList.toggle('dark');
          const isDark = document.documentElement.classList.contains('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
