<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .notearea {
            font-family: 'Courier Prime', monospace;
            resize: none;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50"></div>

    <div id="aboutModal" class="hidden fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-72 text-center">
            <p class="text-2xl mb-2">📝</p>
            <h2 style="font-family: 'DM Serif Display', serif" class="text-lg text-slate-800 mb-1">Om's Notepad</h2>
            <p class="text-xs text-slate-500 mb-1">A simple text editor</p>
            <p class="text-xs text-slate-400">by Om Tiwari</p>
            <button onclick="toggleModal('aboutModal', false)" class="mt-4 text-xs bg-blue-600 text-white px-5 py-1.5 rounded-full hover:bg-blue-700 transition">OK</button>
        </div>
    </div>

    <div id="notesModal" class="hidden fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-80 overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center">
                <span style="font-family: 'DM Serif Display', serif" class="text-base text-slate-800">Open Note</span>
                <button onclick="toggleModal('notesModal', false)" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
            </div>
            <div id="notesList" class="max-h-64 overflow-y-auto"></div>
        </div>
    </div>

    <div class="bg-white border border-slate-300 shadow-2xl rounded-lg overflow-hidden flex flex-col w-full max-w-2xl h-[520px]">
        
        <div id="titleBar" class="bg-white border-b border-slate-200 py-1.5 px-3 text-sm text-slate-800 text-center font-medium">Untitled — Notepad</div>

        <div class="flex border-b border-slate-200 bg-white px-2 py-1 gap-1 text-sm">
            <button onclick="toggleModal('notesModal', true)" class="px-4 py-1.5 rounded text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-all">Open</button>
            <button onclick="saveNote()" class="px-4 py-1.5 rounded text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-all">Save</button>
            <button onclick="deleteNote()" class="px-4 py-1.5 rounded text-slate-700 hover:bg-red-50 hover:text-red-500 transition-all">Delete</button>
            <button onclick="toggleModal('aboutModal', true)" class="px-4 py-1.5 rounded text-slate-700 hover:bg-slate-50 transition-all">About</button>
        </div>

        <textarea id="editor" class="notearea flex-1 w-full p-3 text-sm leading-relaxed border-none outline-none text-slate-900" spellcheck="false" placeholder="Start typing..."></textarea>

        <div class="bg-slate-50 border-top border-slate-300 py-1 px-3 text-xs text-slate-500 flex justify-center items-center select-none">
            <span id="wordCount">0 words</span>
        </div>
    </div>

    <script>
        let activeId = null;
        let isDirty = false;
        
        const editor = document.getElementById('editor');
        const titleBar = document.getElementById('titleBar');
        const wordCount = document.getElementById('wordCount');

        window.onload = () => {
            const notes = getNotes();
            if (notes.length > 0) loadNote(notes[0]);
        };

        function getNotes() {
            return Object.keys(localStorage)
                .filter(key => key.startsWith('note:'))
                .map(key => JSON.parse(localStorage.getItem(key)))
                .sort((a, b) => b.updatedAt - a.updatedAt);
        }

        function saveNote() {
            const text = editor.value.trim();
            if (!text) return showToast("Nothing to save!");
            
            activeId = activeId || `note:${Date.now()}`;
            const note = {
                id: activeId,
                title: text.split('\n')[0].substring(0, 20) || "Untitled",
                body: editor.value,
                updatedAt: Date.now()
            };
            
            localStorage.setItem(activeId, JSON.stringify(note));
            isDirty = false;
            updateUI();
            showToast("Saved successfully.");
        }

        function loadNote(note) {
            activeId = note.id;
            editor.value = note.body;
            isDirty = false;
            toggleModal('notesModal', false);
            updateUI();
        }

        function deleteNote() {
            if (!activeId) return;
            localStorage.removeItem(activeId);
            activeId = null;
            editor.value = "";
            updateUI();
            showToast("Note deleted.");
        }

        function updateUI() {
            const note = getNotes().find(n => n.id === activeId);
            titleBar.innerText = `${isDirty ? '* ' : ''}${note ? note.title : "Untitled"} — Notepad`;
            
            const words = editor.value.trim() ? editor.value.trim().split(/\s+/).length : 0;
            wordCount.innerText = `${words} word${words !== 1 ? 's' : ''}`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        function toggleModal(modalId, show) {
            if (modalId === 'notesModal' && show) renderNotesList();
            document.getElementById(modalId).classList.toggle('hidden', !show);
        }

        function renderNotesList() {
            const list = document.getElementById('notesList');
            const notes = getNotes();
            
            if (notes.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 p-4">No saved notes.</p>`;
                return;
            }

            list.innerHTML = notes.map(note => `
                <div class="px-4 py-3 hover:bg-slate-50 cursor-pointer border-b border-slate-50" onclick='loadNoteById("${note.id}")'>
                    <p class="text-sm text-slate-700 font-medium">${note.title}</p>
                    <p class="text-xs text-slate-400">${new Date(note.updatedAt).toLocaleDateString('en-IN')}</p>
                </div>
            `).join('');
        }

        function loadNoteById(id) {
            const note = JSON.parse(localStorage.getItem(id));
            if (note) loadNote(note);
        }

        editor.addEventListener('input', () => {
            isDirty = true;
            updateUI();
        });

        window.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 's') { 
                e.preventDefault(); 
                saveNote(); 
            }
        });
    </script>
</body>
</html>
