<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        body {
            background-image: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");
            
            
        }

        .settings-title {
            font-size: 30px;
            font-family: "Trebuchet MS", Arial, sans-serif;
            font-weight: bold;
            
        }

        .tab-content {
            display: none;
        }

        .side-menu button {
            font-size: 16px;
            padding: 6px;
            font-weight: 600;
            cursor: pointer;
            height: 48px;
            width: 130px;
        }

        .main-box {
            border: 2px solid rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            background: white;
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.1);
        }

        .content-area {
            border-top: 1px solid rgba(0, 0, 0, 0.2);
        }

        .side-menu button:hover {
            background-color: #f3f3f3;
            border-radius: 2px;
            color: #007bff;
        }

        .active-tab {
            
            background-color: #eee;
            color: #007bff;
        }

        .right-panel {
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: #fafafa;
            border-radius: 10px;
            /* margin: 6px 0; */
            box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.05);
        }

        .wallpaper-grid {
            padding: 12px;
        }

        .wallpaper-grid h2{
            
        }

        .wallpaper-card {
            border: 2px solid white;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s;
            cursor: pointer;
            border-radius: 10px;
        }

        .wallpaper-card:hover {
            transform: scale(1.05);
            border-color: #007bff;
        }

        .wallpaper-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            
        }
        .themes-section p{
            font-size: medium;
        }

        .theme-section h2{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

    </style>
</head>

<body class="min-h-screen bg-no-repeat bg-cover bg-center">
    <div class="main-box m-2 w-2/3 h-[380px] flex flex-col p-3">

        
            <div class="settings-title p-2 h-10 flex items-end">
                Settings
            </div>
       <div class="flex justify-around"> 
         <div class="content-area">
                <ul class="side-menu flex flex-col justify-around h-[290px] mt-2">
                    <li>
                        <button onclick="showTab('about')">About</button>
                    </li>
                    <li>
                        <button onclick="showTab('wallpaper')">Wallpapers</button>
                    </li>
                    <li>
                        <button onclick="showTab('themes')">Themes</button>
                    </li>
                </ul>
         </div>
        
         <div class="right-panel w-[690px] h-[310px] ml-3">
            <div id="about-section" class="tab-content p-6">
                <h2 class="text-3xl font-bold text-slate-700">Verdant OS</h2>
                <p class="mt-3 text-gray-700">
                    A web OS built using HTML, CSS, and JavaScript.
                </p>

                <div class="mt-4">
                    <h3 class="text-sm font-bold text-gray-500 uppercase">
                        Created by:
                    </h3>
                    <ul class="mt-2">
                        <li>Shashwat Tiwari</li>
                        <li>Udbhav Dalmia</li>
                        <li>Om Tiwari</li>
                    </ul>
                </div>
            </div>
            <div id="wallpaper-section" class="tab-content">
                <div class="wallpaper-grid">
                    <h2 class="text-xl font-bold mb-3">Pick a wallpaper</h2>

                    <div class="flex gap-2">
                        <div class="wallpaper-card w-[140px] h-[90px]"
                            onclick="changeBg('https://images.unsplash.com/photo-1484950763426-56b5bf172dbb')">
                            <img src="https://images.unsplash.com/photo-1484950763426-56b5bf172dbb"
                                class="wallpaper-img" />
                        </div>

                        <div class="wallpaper-card w-[140px] h-[90px]"
                            onclick="changeBg('https://cdn.dribbble.com/userupload/16235243/file/original-83e4f7fd367e8c091e79e5aaaf3607ca.png')">
                            <img src="https://cdn.dribbble.com/userupload/16235243/file/original-83e4f7fd367e8c091e79e5aaaf3607ca.png"
                                class="wallpaper-img" />
                        </div>

                        <div class="wallpaper-card w-[140px] h-[90px]"
                            onclick="changeBg('https://images.unsplash.com/photo-1475070929565-c985b496cb9f')">
                            <img src="https://images.unsplash.com/photo-1475070929565-c985b496cb9f"
                                class="wallpaper-img" />
                        </div>
                    </div>
                </div>
            </div>
            <div id="themes-section" class="tab-content p-6">
                <h2 class="text-xl font-bold">Themes</h2>
                <p class="italic">This theme is inspired by macOS and Windows</p>
            </div>

         </div>
        </div>
    </div>

    <script>
        function showTab(tab) {
            const sections = document.querySelectorAll(".tab-content");
            sections.forEach(sec => sec.style.display = "none");

            document.getElementById(tab + "-section").style.display = "block";

            const buttons = document.querySelectorAll(".side-menu button");
            buttons.forEach(btn => btn.classList.remove("active-tab"));

            event.target.classList.add("active-tab");
        }

        function changeBg(url) {
            document.body.style.backgroundImage = `url('${url}')`;
        }

        showTab("about");
    </script>
</body>

</html>
