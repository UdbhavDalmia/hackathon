<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-2xl p-5 w-80 shadow-2xl hover:scale-105 transition-transform duration-300">

        <!-- Header -->
        <div class="bg-white rounded-xl shadow-md px-5 py-3 mb-5">
            <h1 class="text-4xl font-bold text-black">Calculator</h1>
            <p class="text-sm text-gray-500 text-right">by - Om Tiwari</p>
        </div>

        <!-- Display -->
        <input
            type="text"
            id="input"
            placeholder="0"
            class="w-full bg-gray-200 text-black text-3xl text-right px-4 py-3 rounded-xl border-none outline-none shadow-inner mb-4"
            readonly
        />

        <!-- Buttons -->
        <div class="flex gap-2 mb-2">
            <button class="btn">CE</button>
            <button class="btn">DEL</button>
            <button class="btn-accent">⌫</button>
        </div>
        <div class="flex gap-2 mb-2">
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
        </div>
        <div class="flex gap-2 mb-2">
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
        </div>
        <div class="flex gap-2 mb-2">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
        </div>
        <div class="flex gap-2 mb-2">
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn-accent">=</button>
        </div>
        <div class="flex gap-2">
            <button class="btn">+</button>
            <button class="btn">-</button>
            <button class="btn">*</button>
            <button class="btn">/</button>
        </div>
    </div>

    <style>
        .btn {
            flex: 1;
            padding: 14px;
            background-color: #d6d6d6;
            color: #000;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { background-color: #c0c0c0; transform: translateY(-2px); }
        .btn:active { transform: scale(0.95); }

        .btn-accent {
            flex: 1;
            padding: 14px;
            background-color: #007BFF;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-accent:hover { background-color: #3399FF; transform: translateY(-2px); }
        .btn-accent:active { transform: scale(0.95); }
    </style>

    <script>
        const input = document.getElementById('input');
        const buttons = document.querySelectorAll('button');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const label = button.textContent.trim();

                switch (label) {
                    case 'CE':
                        input.value = '';
                        break;
                    case 'DEL':
                    case '⌫':
                        input.value = input.value.slice(0, -1);
                        break;
                    case '=': {
                        const expr = input.value;
                        if (/^[0-9+\-*/.()\s]+$/.test(expr)) {
                            try {
                                const result = Function('"use strict"; return (' + expr + ')')();
                                input.value = String(result);
                            } catch (_) {
                                input.value = 'Error';
                            }
                        } else {
                            input.value = 'Error';
                        }
                        break;
                    }
                    default:
                        input.value += label;
                }
            });
        });
    </script>
</body>
</html>
