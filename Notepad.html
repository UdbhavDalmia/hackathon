
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .notepad-textarea {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            border: none;
            outline: none;
            width: 100%;
            flex: 1;
            padding: 8px 10px;
            background: #fff;
            color: #111;
        }
        .status-bar { 
            background: #f3f4f6; border-top: 1px solid #d1d5db;
            padding: 2px 10px; font-size: 12px; color: #555;
            display: flex; justify-content: center; align-items: center;
            user-select: none;
        }
        .title-bar {
            background: #fff; border-bottom: 1px solid #e5e7eb;
            padding: 6px 12px; font-size: 13px; color: #333;
            text-align: center; font-weight: 500;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50">
        Saved successfully.
    </div>

    <div id="aboutModal" class="hidden fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-72 text-center">
            <p class="text-2xl mb-2">📝</p>
            <h2 style="font-family: 'DM Serif Display', serif" class="text-lg text-slate-800 mb-1">Om's Notepad</h2>
            <p class="text-xs text-slate-500 mb-1">A simple text editor</p>
            <p class="text-xs text-slate-400">by Om Tiwari</p>
            <button onclick="toggleAbout(false)" class="mt-4 text-xs bg-blue-600 text-white px-5 py-1.5 rounded-full hover:bg-blue-700 transition">OK</button>
        </div>
    </div>

    <div id="notesModal" class="hidden fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-80 overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center">
                <span style="font-family: 'DM Serif Display', serif" class="text-base text-slate-800">Open Note</span>
                <button onclick="toggleNotes(false)" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
            </div>
            <div id="notesList" class="max-h-64 overflow-y-auto">
                </div>
        </div>
    </div>

    <div class="bg-white border border-slate-300 shadow-2xl rounded-lg overflow-hidden flex flex-col w-full max-w-2xl" style="height: 520px;">
        
        <div id="titleBar" class="title-bar">Untitled — Notepad</div>

        <div class="flex border-b border-slate-200 bg-white px-2 gap-1" style="font-size: 13px;">
            <button onclick="toggleNotes(true)" class="px-4 py-1.5 rounded text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-all">Open</button>
            <button onclick="saveNote()" class="px-4 py-1.5 rounded text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-all">Save</button>
            <button onclick="deleteActiveNote()" class="px-4 py-1.5 rounded text-slate-700 hover:bg-red-50 hover:text-red-500 transition-all">Delete</button>
            <button onclick="toggleAbout(true)" class="px-4 py-1.5 rounded text-slate-700 hover:bg-slate-50 transition-all">About</button>
        </div>

        <textarea id="editor" class="notepad-textarea" spellcheck="false" placeholder="Start typing..."></textarea>

        <div class="status-bar">
            <span id="wordCount">0 words</span>
        </div>
    </div>

    <script>
        let activeNoteId = null;
        let isDirty = false;
        const editor = document.getElementById('editor');
        const titleBar = document.getElementById('titleBar');
        const wordCountDisplay = document.getElementById('wordCount');

        // Initial Load
        window.onload = () => {
            renderNotesList();
            const lastNote = getNotes()[0];
            if (lastNote) loadNote(lastNote);
        };

        // --- Logic Functions ---

        function getNotes() {
            const notes = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('note:')) {
                    notes.push(JSON.parse(localStorage.getItem(key)));
                }
            }
            return notes.sort((a, b) => b.updatedAt - a.updatedAt);
        }

        function saveNote() {
            const body = editor.value;
            if (!body.trim()) { showToast("Nothing to save!"); return; }
            
            const id = activeNoteId || `note:${Date.now()}`;
            const note = {
                id,
                title: body.split('\n')[0].substring(0, 20) || "Untitled",
                body,
                updatedAt: Date.now()
            };
            
            localStorage.setItem(id, JSON.stringify(note));
            activeNoteId = id;
            isDirty = false;
            updateUI();
            showToast("Saved successfully.");
        }

        function loadNote(note) {
            activeNoteId = note.id;
            editor.value = note.body;
            isDirty = false;
            toggleNotes(false);
            updateUI();
        }

        function deleteActiveNote() {
            if (!activeNoteId) return;
            localStorage.removeItem(activeNoteId);
            activeNoteId = null;
            editor.value = "";
            updateUI();
            showToast("Note deleted.");
        }

        function updateUI() {
            const notes = getNotes();
            const currentNote = notes.find(n => n.id === activeNoteId);
            const title = currentNote ? currentNote.title : "Untitled";
            titleBar.innerText = `${isDirty ? '* ' : ''}${title} — Notepad`;
            
            const words = editor.value.trim() === "" ? 0 : editor.value.trim().split(/\s+/).length;
            wordCountDisplay.innerText = `${words} word${words !== 1 ? 's' : ''}`;
        }

        // --- UI Handlers ---

        editor.addEventListener('input', () => {
            isDirty = true;
            updateUI();
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        function toggleAbout(show) {
            document.getElementById('aboutModal').classList.toggle('hidden', !show);
        }

        function toggleNotes(show) {
            if (show) renderNotesList();
            document.getElementById('notesModal').classList.toggle('hidden', !show);
        }

        function renderNotesList() {
            const list = document.getElementById('notesList');
            const notes = getNotes();
            
            if (notes.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 p-4">No saved notes.</p>`;
                return;
            }

            list.innerHTML = notes.map(note => `
                <div class="flex items-center justify-between px-4 py-3 hover:bg-slate-50 cursor-pointer border-b border-slate-50" onclick='loadNoteById("${note.id}")'>
                    <div>
                        <p class="text-sm text-slate-700 font-medium">${note.title}</p>
                        <p class="text-xs text-slate-400">${new Date(note.updatedAt).toLocaleDateString('en-IN')}</p>
                    </div>
                </div>
            `).join('');
        }

        function loadNoteById(id) {
            const note = JSON.parse(localStorage.getItem(id));
            if (note) loadNote(note);
        }

        // Shortcuts
        window.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveNote(); }
        });
    </script>
</body>
</html>
