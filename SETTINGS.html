<!doctype html>

<html>



<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        body {

            background-image: url(./images.jpeg);

            background-repeat: no-repeat;

            background-position: center;

            background-size: cover;

            background-attachment: fixed;

        }



        .title p {

            font-size: 24px;

            line-height: 50px;

            padding-left: 14px;

            border-bottom: 2px solid rgba(0, 0, 0, 0.21);

            font-family: sans-serif;

        }



        .setting-list ul li button {

            font-size: 15px;

            font-weight: 500;

            font-family: Verdana, Geneva, Tahoma, sans-serif;

            cursor: pointer;

            width: 200px;

            text-align: left;

        }



        .setting-list ul li button:hover {

            background-color: rgba(0, 0, 0, 0.05);

            border-radius: 5px;

        }



        .setting-list ul li button:active {

            background-color: #007bff;

            border-radius: 5px;

            color: rgb(203, 202, 202);

            border: none;

        }



        .settings {

            margin: 20px;

            border-radius: 15px;

        }



        .setting-list-content {

            margin-top: 15px;

            border-radius: 25px;

        }
    </style>

</head>



<body>

    <div class="settings backdrop-blur-md bg-white/40 p-[15px] w-[53vw]">

        <div class="title text-black font-semibold tracking-wider w-[50vw]">

            <p>Settings</p>

        </div>



        <div class="content flex w-[50vw] h-[70vh] justify-around">

            <div class="setting-list w-[15vw] h-[70vh] flex items-center justify-around ">

                <ul class="flex flex-col gap-[20px] text-black">

                    <li class="tracking-wide p-[10px]">

                        <button class="p-[10px]">About Verdant</button>

                    </li>

                    <li class="tracking-wide p-[10px]">

                        <button class="tracking-wide p-[10px]">Wallpaper</button>

                    </li>

                    <li class="p-[10px]">

                        <button class="p-[10px]">Theme</button>

                    </li>

                </ul>

            </div>





            <div class="setting-list-content w-[32vw] backdrop-blur-xl text-slate-800 bg-white/70">
                <div class="about flex flex-col items-center justify-around h-full">
                    <div class="about-title">

                        <h1 class="text-4xl font-bold mb-4">Verdant OS</h1>
                    </div>

                    <div class="about-content px-[5px]">

                        <p class="text-lg">Verdant is a modern and sleek desktop environment designed to provide a seamless and enjoyable user experience.</p>
                    </div>
                    <div class="about-creator">
                        <ul>
                            <li class="text-lg mt-4"> Shashwat Tiwari</li>
                            <li class="text-lg mt-2">Version: 1.0.0</li>
                            <li class="text-lg mt-2">Release Date: June 2024</li>
                        </ul>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>



</html>
