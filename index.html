<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div style="background-image: url('/images/wallpaper-default.jpeg');" class="h-screen bg-cover bg-center relative">
        <nav
            class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center px-4 py-3 bg-white/20 backdrop-blur-2xl border border-white/30 rounded-3xl shadow-2xl space-x-6">
            <button class="hover:scale-110 transition-transform">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg">
                    <span class="text-white font-bold">B</span>
                </div>
            </button>
            <div class="flex space-x-4 border-l border-white/20 pl-4">
                <button class="group flex flex-col items-center">
                    <img src="calc-icon.svg" class="w-10 h-10 group-hover:-translate-y-1 transition-all" alt="Calc">
                    <div class="w-1 h-1 bg-white rounded-full mt-1 opacity-100"></div>
                </button>
                <button class="group flex flex-col items-center">
                    <img src="calendar-icon.svg" class="w-10 h-10 group-hover:-translate-y-1 transition-all"
                        alt="Calendar">
                    <div class="w-1 h-1 bg-white rounded-full mt-1 opacity-0 group-hover:opacity-50"></div>
                </button>
            </div>
            <div class="flex items-center space-x-4 border-l border-white/20 pl-4 text-white text-sm font-medium">
                <div class="flex flex-col items-end leading-tight">
                    <span>10:45 AM</span>
                    <span class="text-[10px] opacity-70">May 24</span>
                </div>
            </div>
        </nav>
    </div>
</body>

</html>
