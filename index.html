<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdant OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'text': '#041225',
                        'background': '#f5f5f5',
                        'primary': '#16506f',
                        'secondary': '#8fe1ef',
                        'accent': '#ffa857',
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-screen overflow-hidden bg-primary">
    <div id="login">
        <div class="flex items-center justify-center h-screen bg-[url('/images/login-bg.jpeg')] bg-cover bg-center bg-no-repeat">
            <div class="w-[90%] max-w-2xl">
                <h2 class="text-7xl text-center font-semibold text-background mb-10">Hello, User!</h2>
                <form id="login-form" class="space-y-4" novalidate>
                    <div>
                        <label for="email" class="sr-only">Email</label>
                        <input id="email" name="email" type="email" placeholder="email@gmail.com" required
                            class="w-full px-4 py-3 rounded-xl bg-white/20 hover:bg-white/10 transition-all border border-white/30 hover:border-white/80 text-background placeholder:text-background/60 outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div class="relative">
                        <label for="password" class="sr-only">Password</label>
                        <input id="password" name="password" type="password" placeholder="Password" required
                            class="w-full px-4 py-3 rounded-xl bg-white/20 hover:bg-white/10 transition-all border border-white/30 hover:border-white/80 text-background placeholder:text-background/60 outline-none focus:ring-2 focus:ring-primary" />
                        <button type="button" id="togglePassword" aria-label="Show password"
                            class="absolute right-2 top-1/2 -translate-y-1/2 text-background/80 px-2 py-1 rounded-md hover:text-white hover:bg-primary/10">Show</button>
                    </div>
                    <div class="flex items-center justify-between">
                        <button type="submit"
                            class=" object-center mt-3 mx-auto w-fit bg-secondary px-16 py-2 rounded-xl text-primary font-bold hover:brightness-110 active:scale-95 transition-all shadow-lg">Login</button>
                    </div>
                    <div class="text-sm text-red-500 text-center shadow-2xl" id="login-error" role="alert" aria-live="polite"></div>
                </form>
            </div>
            <div class="absolute bottom-10 flex items-center space-x-3 opacity-80 hover:opacity-100 transition-opacity">
                <div class="w-8 h-8 bg-[#63e6be] rounded-lg flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-leaf text-primary text-lg"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-widest text-background uppercase">Verdant os</h1>
            </div>
        </div>
    </div>
    <div id="home" style="display: none;" class="relative h-full w-full bg-[url('/images/wallpaper-default.jpg')] bg-cover bg-center bg-no-repeat flex flex-col">
        <main id="desktop" class="grow relative p-6">
            <div id="calculator" class="absolute z-10 hidden">
                <div class="bg-white rounded-2xl p-5 w-80 shadow-2xl transition-transform duration-300">
                    <div id="calc-header" class="cursor-grab active:cursor-grabbing pb-2 mb-4 border-b border-slate-100 flex justify-between items-center">
                        <h2 class="text-xs font-bold text-black uppercase tracking-widest pointer-events-none">Calculator</h2>
                        <button aria-label="Close calculator" title="Close" type="button" onclick="toggleCalculator()"
                            class="w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center text-xs shadow-sm hover:brightness-90 transition">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <input type="text" id="input" placeholder="0" class="w-full bg-gray-200 text-black text-3xl text-right px-4 py-3 rounded-xl border-none outline-none shadow-inner mb-4" readonly />
                    <div class="flex gap-2 mb-2">
                        <button class="btn">CE</button>
                        <button class="btn-accent"><i class="fa-solid fa-delete-left"></i></button>
                    </div>
                    <div class="flex gap-2 mb-2">
                        <button class="btn">1</button>
                        <button class="btn">2</button>
                        <button class="btn">3</button>
                    </div>
                    <div class="flex gap-2 mb-2">
                        <button class="btn">4</button>
                        <button class="btn">5</button>
                        <button class="btn">6</button>
                    </div>
                    <div class="flex gap-2 mb-2">
                        <button class="btn">7</button>
                        <button class="btn">8</button>
                        <button class="btn">9</button>
                    </div>
                    <div class="flex gap-2 mb-2">
                        <button class="btn">0</button>
                        <button class="btn">.</button>
                        <button class="btn-accent">=</button>
                    </div>
                    <div class="flex gap-2">
                        <button class="btn">+</button>
                        <button class="btn">-</button>
                        <button class="btn">*</button>
                        <button class="btn">/</button>
                    </div>
                </div>
            </div>
            <div id="calendar" class="absolute z-10 hidden">
                <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm p-6">
                    <div id="calendar-header" class="cursor-grab active:cursor-grabbing pb-2 mb-4 border-b border-slate-100 flex justify-between items-center">
                        <h2 class="text-xs font-bold text-black uppercase tracking-widest pointer-events-none">Calendar</h2>
                        <button aria-label="Close calendar" title="Close" type="button" onclick="toggleCalendar()"
                            class="w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center text-xs shadow-sm hover:brightness-90 transition">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div class="flex items-center justify-between mb-6">
                        <button id="prev" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <div class="text-center">
                            <h1 id="month-name" class="month-title font-bold text-2xl text-slate-800"></h1>
                            <p id="year" class="text-sm text-slate-400 font-light"></p>
                        </div>
                        <button id="next" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                    <div class="grid grid-cols-7 mb-2">
                        <div class="text-center text-xs text-red-400 py-1">Su</div>
                        <div class="text-center text-xs text-slate-400 py-1">Mo</div>
                        <div class="text-center text-xs text-slate-400 py-1">Tu</div>
                        <div class="text-center text-xs text-slate-400 py-1">We</div>
                        <div class="text-center text-xs text-slate-400 py-1">Th</div>
                        <div class="text-center text-xs text-slate-400 py-1">Fr</div>
                        <div class="text-center text-xs text-slate-400 py-1">Sa</div>
                    </div>
                    <div id="days-grid" class="grid grid-cols-7 gap-y-1"></div>
                    <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center">
                        <button id="today-btn" class="text-xs text-[#007bff] hover:text-blue-700 font-medium transition">Today</button>
                        <p id="today-label" class="text-xs text-slate-400"></p>
                    </div>
                </div>
            </div>
        </main>
        <nav class="mb-3 self-center flex items-center px-3 py-2 bg-white/10 backdrop-blur-3xl border border-white/20 rounded-2xl shadow-2xl space-x-4">
            <button id="start-menu-btn" class="hover:scale-105 active:scale-95 transition-all focus:outline-none" aria-label="Start Menu">
                <div class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-lg flex items-center justify-center shadow-lg border border-white/20 hover:bg-white/30 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                        <rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                    </svg>
                </div>
            </button>
            <div class="flex space-x-2 border-l border-white/10 pl-4">
                <button class="group relative p-2 rounded-xl hover:bg-white/10 transition-colors" onclick="toggleCalculator()">
                    <i class="fa-solid fa-calculator text-white text-2xl group-hover:-translate-y-1 transition-transform"></i>
                    <div class="absolute w-1 h-1 bg-white rounded-full opacity-0"></div>
                </button>
                <button class="group relative p-2 rounded-xl hover:bg-white/10 transition-colors" onclick="toggleCalendar()">
                    <i class="fa-solid fa-calendar text-white text-2xl group-hover:-translate-y-1 transition-transform"></i>
                    <div class="absolute w-1 h-1 bg-white rounded-full opacity-0"></div>
                </button>
                <button class="group relative p-2 rounded-xl hover:bg-white/10 transition-colors">
                    <i class="fa-solid fa-gear text-white text-2xl group-hover:-translate-y-1 transition-transform"></i>
                    <div class="absolute w-1 h-1 bg-white rounded-full opacity-0"></div>
                </button>
                <button class="group relative p-2 rounded-xl hover:bg-white/10 transition-colors">
                    <i class="fa-solid fa-clipboard text-white text-2xl group-hover:-translate-y-1 transition-transform"></i>
                    <div class="absolute w-1 h-1 bg-white rounded-full opacity-0"></div>
                </button>
            </div>
            <div class="flex items-center border-l border-white/10 pl-4 text-background">
                <div class="flex flex-col items-center leading-none">
                    <span class="text-sm font-semibold tracking-tighter" id="time_element">10:45 AM</span>
                    <span class="text-[10px] uppercase opacity-60 font-bold mt-1" id="date_element">May 24</span>
                </div>
            </div>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
